services:
  - type: web
    name: ammi-abbu-ka-sacha-beta
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeploy: true
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: BOT_TOKEN
        sync: false
      - key: BOSS_ID
        value: "6484999726"
      # Customer chat flow: only Cart + Address links in, one Confirm tap, then
      # the Swiggy payment QR and tracking link — all inside Telegram.
      - key: SIMPLE_CHAT_MODE
        value: "1"
      - key: GITHUB_REPO_SLUG
        value: "hulm0408/ammi-abbu-ka-sacha-beta"
      - key: GITHUB_VAULT_TOKEN
        sync: false
