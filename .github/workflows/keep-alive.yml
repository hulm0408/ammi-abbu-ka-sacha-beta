name: 24x7 Render Keep-Alive Cron

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  ping-render:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Ping Ammi Abbu Ka Sacha Beta Render Server
        run: |
          echo "Pinging live Render bot server..."
          RESPONSE=$(curl -sS --retry 3 --retry-delay 5 --max-time 30 -w "\nHTTP_CODE:%{http_code}" https://ammi-abbu-ka-sacha-beta.onrender.com/)
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q "HTTP_CODE:200"
